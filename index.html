<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Arcade Economy Test</title>
    <style>
        /* Add your UI styling here */
        body { font-family: sans-serif; padding: 20px; background: #222; color: #fff; }
        .btn { padding: 10px 20px; background: #00bcd4; border: none; cursor: pointer; }
    </style>
</head>
<body>

    <h1>Arcade Economy System</h1>
    <button class="btn" onclick="triggerSimulatedFetch()">Earn Game Credits</button>

    <script>
        // --- 1. SIMULATED BACKEND DATABASE ---
        // Instead of a real server database, use localStorage or a local object variable
        let playerDatabase = {
            "player_123": { totalCredits: 500, earningMinutesToday: 0, lastActiveTime: Date.now() }
        };

        // --- 2. SIMULATED API ENDPOINT ---
        // Replace your app.post('/api/arcade/earn') logic with a standard frontend function
        function simulateEarnEndpoint(playerId, gameSessionMinutes) {
            const player = playerDatabase[playerId];
            if (!player) return { error: "Player profile not found." };

            let multiplier = 1.0;
            // Your rest bonus checks, daily limits, and credit logic go here
            let actualCredits = Math.round(gameSessionMinutes * multiplier);
            player.totalCredits += actualCredits;

            return { success: true, creditsAdded: actualCredits, totalCredits: player.totalCredits };
        }

        // --- 3. FRONTEND INTERACTION ---
        function triggerSimulatedFetch() {
            // Simulating your fetch().then() chain locally
            const data = simulateEarnEndpoint("player_123", 20); 
            
            if (data.success) {
                alert(`Success! Total Credits: ${data.totalCredits}`);
            } else {
                alert(`Error: ${data.error}`);
            }
        }
    </script>
</body>
</html>
